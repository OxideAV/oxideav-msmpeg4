[package]
name = "oxideav-msmpeg4"
version = "0.0.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mark Karpeles"]
description = "Pure-Rust Microsoft MPEG-4 (v1 / v2 / v3) decoder for oxideav — the codec behind DIV3 / DIV4 / MP41 / MP42 / MP43 AVI files, distinct from standard MPEG-4 Part 2 (XVID / DIVX / DX50)"
repository = "https://github.com/OxideAV/oxideav-msmpeg4"
homepage = "https://github.com/OxideAV/oxideav-msmpeg4"
readme = "README.md"
keywords = ["multimedia", "video", "msmpeg4", "divx3", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]
build = "build.rs"
include = [
    "src/**/*.rs",
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "tables/*.csv",
]

[dependencies]
oxideav-core = "0.1"

[dev-dependencies]
# `ureq` powers the URL-backed `microsoft_fixtures` integration test
# (`tests/microsoft_fixtures.rs`), which fetches real Microsoft-encoded
# MS-MPEG4 v3 streams from samples.oxideav.org for the cleanroom-side
# `pri_A`/`pri_B` runtime-binding triangulation. The fixtures are cached
# on disk under `target/test-fixtures/` after the first fetch and the
# test gracefully skips when offline / no cache.
ureq = "3"
